spring.application.name=user-management-backend
server.port=10000


#数据库连接
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/test?serverTimezone=Asia/Shanghai&autoReconnect=true&useUnicode=true&characterEncoding=UTF-8&useAffectedRows=true
spring.datasource.username=root
spring.datasource.password=root



# MyBatis配置
# resource目录下
mybatis.mapper-locations=classpath:mapper/*.xml
# Mapper接口存放的目录
mybatis.type-aliases-package=com.mall.dao
# mybatis开启下画线转驼峰配置
mybatis.configuration.map-underscore-to-camel-case=true
# 另外一种打印语句的方式
mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
#打印sql时的语句
logging.level.com.mall.dao=Debug


# MyBatis-Plus
mybatis-plus.mapper-locations=classpath:mapper/**/*.xml
mybatis-plus.type-aliases-package=com.usermangement.model

# JWT
jwt.secret=your_jwt_secret_key
jwt.expiration=604800









